<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Media browser · Mefi's Studio AI+</title>
  <link rel="stylesheet" href="media-browser.css">
  <script defer src="media-browser.js"></script>
</head>
<body>
  <header class="browser-toolbar">
    <div class="browser-topline">
      <strong>STUDIO <span> / MEDIA</span></strong>
      <div class="browser-actions">
        <button id="browser-mute" type="button" aria-pressed="false">Mute</button>
        <button id="browser-pin" type="button" aria-pressed="false">Keep on top</button>
        <button id="browser-external" type="button">Open in browser ↗</button>
      </div>
    </div>
    <form id="browser-form" class="browser-address-row">
      <button id="browser-back" type="button" aria-label="Back" title="Back" disabled>←</button>
      <button id="browser-forward" type="button" aria-label="Forward" title="Forward" disabled>→</button>
      <button id="browser-reload" type="button" aria-label="Reload" title="Reload">↻</button>
      <input id="browser-address" aria-label="Web address" placeholder="Paste a link or enter a website" autocomplete="off" spellcheck="false" maxlength="8192">
      <button type="submit" class="browser-go">Go</button>
    </form>
    <p id="browser-status" role="status">Ready for your next soundtrack.</p>
  </header>
  <main class="browser-welcome">
    <span class="browser-mark" aria-hidden="true">↗</span>
    <p class="browser-eyebrow">A little room for your media</p>
    <h1>Find your soundtrack.</h1>
    <p>Open a video, a live stream or your favourite music site.<br>Keep it beside your work, in its own window.</p>
    <nav aria-label="Media sites">
      <button data-url="https://www.youtube.com">YouTube</button>
      <button data-url="https://music.youtube.com">YouTube Music</button>
      <button data-url="https://open.spotify.com">Spotify</button>
      <button data-url="https://soundcloud.com">SoundCloud</button>
      <button data-url="https://www.twitch.tv">Twitch</button>
    </nav>
    <small>Some services require your regular browser for sign-in or protected playback.</small>
  </main>
</body>
</html>
